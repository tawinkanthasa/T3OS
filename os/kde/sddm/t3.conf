# T3 login screen
[General]
# no on-screen (phone-style) keyboard: SDDM's default is qtvirtualkeyboard
InputMethod=
# draw the login screen with KWin (Wayland), like the desktop, instead of starting Xorg:
# a few seconds faster and no flicker when Plasma takes over.
# If the login screen ever fails to appear: Ctrl+Alt+F3, log in, and delete these three
# Wayland lines (sudo nano /etc/sddm.conf.d/t3.conf), then reboot.
DisplayServer=wayland
GreeterEnvironment=QT_WAYLAND_SHELL_INTEGRATION=layer-shell

[Wayland]
CompositorCommand=kwin_wayland --drm --no-lockscreen --no-global-shortcuts --locale1

[Theme]
Current=t3
CursorTheme=breeze_cursors
