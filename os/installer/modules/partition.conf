---
# T3: Btrfs by default (snapshots / restore from the boot menu); ext4 still selectable.
efi:
    mountPoint:      "/boot/efi"
    recommendedSize: 512MiB
    minimumSize:     64MiB
    label:           "EFI"
userSwapChoices:
    - none      # T3 uses zram (compressed RAM) instead
    - small
    - suspend
    - file
initialSwapChoice: none
drawNestedPartitions: false
alwaysShowPartitionLabels: true
allowManualPartitioning: true
showNotEncryptedBootMessage: false
enableLuksAutomatedPartitioning: true
initialPartitioningChoice: none
defaultFileSystemType: "btrfs"
availableFileSystemTypes: [ "btrfs", "ext4" ]
