# T3 boot menu (read after /etc/default/grub)
GRUB_DISTRIBUTOR="T3"
GRUB_TIMEOUT=5
GRUB_TIMEOUT_STYLE=menu
# list Windows (and other systems) in the menu; Debian turns this off by default
GRUB_DISABLE_OS_PROBER=false
# GRUB can't write its environment on Btrfs, so "remember last choice" would error: keep 0
GRUB_DEFAULT=0
GRUB_DISABLE_SUBMENU=y
# T3 look: themed menu, Plymouth splash instead of boot text
GRUB_THEME=/boot/grub/themes/t3/theme.txt
GRUB_GFXMODE=auto
GRUB_CMDLINE_LINUX_DEFAULT="quiet splash"
